name: CI
"on":
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
permissions:
  contents: read
concurrency:
  group: "ci-${{ github.ref }}"
  cancel-in-progress: true
jobs:
  ci:
    name: "lint + typecheck + knip + test + build"
    runs-on: ubuntu-latest
    steps:
      - name: Harden and check out with Zuke
        uses: zuke-build/zuke@7a62523bb4569e4d90e972dee74bf9cf09cd436f # v1.0.1
        with:
          egress-policy: audit
          persist-credentials: "false"
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Run ci with Zuke
        run: ./zuke ci
